name: Validate local viewer

on:
  push:
    branches: [main, develop]
    paths:
      - "server.py"
      - "backend/**/*.py"
      - "cli.py"
      - "index.html"
      - "src/**/*.js"
      - "tests/browser/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/validate-local-viewer.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "server.py"
      - "backend/**/*.py"
      - "cli.py"
      - "index.html"
      - "src/**/*.js"
      - "tests/browser/**"
      - "package.json"
      - "playwright.config.mjs"
      - ".github/workflows/validate-local-viewer.yml"

permissions:
  contents: read

jobs:
  validate-local-viewer:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.8

      - name: Compile Python entry points
        shell: bash
        run: python -m py_compile server.py cli.py backend/kiro_catalog.py tests/browser/create-fixtures.py

      - name: Run CLI with an empty project root
        shell: bash
        run: |
          set -euo pipefail
          empty_root="$RUNNER_TEMP/agent-config-viewer-empty-root"
          mkdir -p "$empty_root"
          AGENT_CONFIG_VIEWER_PROJECT_ROOT="$empty_root" AGENT_CONFIG_VIEWER_HOME_ROOT="$empty_root" python cli.py list --json > "$RUNNER_TEMP/catalog.json"
          python - "$RUNNER_TEMP/catalog.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as catalog_file:
              results = json.load(catalog_file)["providerResults"]

          assert [result["providerId"] for result in results] == ["kiro", "claude", "gemini", "codex"]
          assert all(result["status"] == "not_found" for result in results)
          assert all(not result["fileEntries"] for result in results)
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Check ES module syntax
        shell: bash
        run: find src -type f -name "*.js" -print0 | xargs -0 -r -n1 node --check

  browser-e2e:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Install Playwright and Chromium
        shell: bash
        run: |
          npm install --ignore-scripts
          npx playwright install --with-deps chromium

      - name: Create isolated configuration fixtures
        shell: bash
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/agent-config-viewer-e2e-root"
          python tests/browser/create-fixtures.py "$fixture_root"
          echo "E2E_PROJECT_ROOT=$fixture_root/project" >> "$GITHUB_ENV"
          echo "E2E_HOME_ROOT=$fixture_root/user" >> "$GITHUB_ENV"

      - name: Start local viewer
        shell: bash
        run: |
          set -euo pipefail
          AGENT_CONFIG_VIEWER_PROJECT_ROOT="$E2E_PROJECT_ROOT" AGENT_CONFIG_VIEWER_HOME_ROOT="$E2E_HOME_ROOT" python server.py > "$RUNNER_TEMP/local-viewer-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/local-viewer-server.pid"
          for attempt in {1..30}; do
            if python -c "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/api/catalog', timeout=1).read()" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/local-viewer-server.log"
          exit 1

      - name: Run browser E2E tests
        shell: bash
        run: LOCAL_VIEWER_URL="http://127.0.0.1:8765" E2E_PROJECT_ROOT="$E2E_PROJECT_ROOT" E2E_HOME_ROOT="$E2E_HOME_ROOT" npm run test:browser

      - name: Stop local viewer
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/local-viewer-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/local-viewer-server.pid")" || true
          fi

      - name: Upload browser E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-viewer-browser-e2e-diagnostics
          path: |
            test-results
            playwright-report
            ${{ runner.temp }}/local-viewer-server.log
          if-no-files-found: ignore
          retention-days: 7
